<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - FitBuddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1f2937, #111827);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f3f4f6;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      text-align: center;
    }
    .lock-icon { font-size: 2.2rem; margin-bottom: 6px; }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 6px;
      color: #fbbf24;
    }
    .subtitle {
      color: #9ca3af;
      font-size: 0.88rem;
      margin-bottom: 22px;
    }
    label {
      display: block;
      text-align: left;
      font-size: 0.85rem;
      margin: 4px 0 6px;
      color: #d1d5db;
    }
    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #f9fafb;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input::placeholder { color: #9ca3af; }
    input:focus { border-color: #fb923c; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      color: white;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(59,130,246,0.4);
    }
    .error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      text-align: left;
    }
    .nav-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #93c5fd;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .nav-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock-icon">🔒</div>
    <h1>Admin Access</h1>
    <p class="subtitle">Enter the admin password to view all users and their plans.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/admin-login" method="post">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter admin password" required autofocus>
      <button type="submit">Unlock Dashboard</button>
    </form>

    <a class="nav-link" href="/">← Back to form</a>
  </div>
</body>
</html>
